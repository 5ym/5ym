name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_display: columns
          config_timezone: Asia/Tokyo
          config_order: isocalendar, languages, achievements, rss

          # 直近半年のコントリビューション
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # よく使う言語
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_details: percentage

          # アチーブメントは A ランク以上のみコンパクト表示
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: A
          plugin_achievements_secrets: no

          # ブログの最新記事
          plugin_rss: yes
          plugin_rss_source: https://doany.io/feed.xml
          plugin_rss_limit: 2
